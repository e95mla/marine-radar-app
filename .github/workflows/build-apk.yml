name: Build debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: gradle assembleDebug --no-daemon

      - name: Rename APK with run number (så varje bygge syns tydligt)
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/marine-radar-${{ github.run_number }}.apk

      - name: Upload APK (artifact, kräver GitHub-inloggning att ladda ner)
        uses: actions/upload-artifact@v4
        with:
          name: marine-radar-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicera som GitHub Release (enklast att ladda ner på mobil)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Senaste bygget (#${{ github.run_number }})"
          body: "Automatiskt byggd APK från commit ${{ github.sha }}. Ladda ner filen nedan direkt i telefonens webbläsare."
          files: app/build/outputs/apk/debug/marine-radar-${{ github.run_number }}.apk
          make_latest: true
